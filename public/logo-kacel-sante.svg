<svg viewBox="0 0 120 120" width="120" height="120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cercle de fond noir avec contour or/jaune #F5C518 -->
  <circle cx="60" cy="60" r="54" fill="#1A1A1A" stroke="#F5C518" stroke-width="3.5" />
  
  <!-- Tête : Petit cercle blanc -->
  <circle cx="60" cy="32" r="5.5" fill="#FFFFFF" />
  
  <!-- Silhouette humaine stylisée en jaune/or formant un K avec bras levés -->
  <!-- Tronc et jambe gauche -->
  <path d="M57 41 C55 52, 53 62, 50 70 C53 70, 57 65, 59 55 C60 48, 59 42, 57 41 Z" fill="#F5C518" />
  <!-- Bras gauche levé -->
  <path d="M57 43 C50 36, 42 34, 38 37 C42 41, 49 44, 55 46 Z" fill="#F5C518" />
  <!-- Bras droit levé / branche haute du K -->
  <path d="M58 43 C66 35, 75 32, 80 35 C75 40, 67 44, 60 46 Z" fill="#F5C518" />
  <!-- Branche basse du K / jambe droite -->
  <path d="M57 52 C65 57, 73 63, 78 68 C72 68, 64 62, 57 56 Z" fill="#F5C518" />

  <!-- Texte : "KACELSANTÉ" en blanc, centré sous la silhouette -->
  <text x="60" y="77" fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="8.5" text-anchor="middle" letter-spacing="0.9">KACELSANTÉ</text>

  <!-- 3 Vagues : Lignes ondulées jaunes/or (#F5C518) en bas du cercle -->
  <path d="M34 85 Q47 82, 60 85 T86 85" stroke="#F5C518" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M37 89 Q47 86, 60 89 T83 89" stroke="#F5C518" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M41 93 Q47 90, 60 93 T79 93" stroke="#F5C518" stroke-width="1.8" stroke-linecap="round" fill="none" />
</svg>
